<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Bài Viết - Lớp 12A7</title>
    <style>
        :root {
            --primary-color: #003366;
            --secondary-color: #0055a5;
            --bg-light: #f4f6f9;
            --text-color: #333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        body { 
            background-color: var(--bg-light); 
            color: var(--text-color); 
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 20px 0;
            border-bottom: 4px solid #ffcc00;
        }
        .header-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .header-text h1 { font-size: 22px; text-transform: uppercase; }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 15px;
            flex: 1;
        }

        .card {
            background: white;
            border-radius: 6px;
            padding: 25px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .article-title {
            color: var(--primary-color);
            font-size: 22px;
            margin-bottom: 10px;
        }
        .article-meta {
            font-size: 13px;
            color: #666;
            border-bottom: 1px solid #eee;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }
        .article-body {
            font-size: 15px;
            color: #333;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 8px 16px;
            background-color: var(--primary-color);
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
        }
        .back-btn:hover { background-color: var(--secondary-color); }
        .empty-state { text-align: center; color: #cc0000; font-weight: bold; font-size: 18px; padding: 30px 0; }

        footer {
            background-color: #001529;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="header-text">
                <h1>CỔNG THÔNG TIN LỚP 12A7</h1>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="card" id="article-box">
            <div style="text-align: center; color: #777; padding: 20px 0;">⏳ Đang tải bài viết...</div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Cổng thông tin Lớp 12A7 - Trung tâm GDNN - GDTX Phú Nhuận</p>
        <p>Phát triển và vận hành bởi Tập thể Lớp 12A7</p>
    </footer>

    <script>
        const SPREADSHEET_ID = '10WZAkfTsUhEsTRADxZ3JX869kLV_Sen45r4BeSrxDZY';
        const GID_BAO_BAI = '1447199433';

        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id');
        const rowIndex = urlParams.get('row');
        const articleType = urlParams.get('type');

        function parseCellValue(cell) {
            if (!cell || cell.v === null || cell.v === undefined) return '';
            if (cell.f) return String(cell.f).trim();
            let val = String(cell.v).trim();
            if (val.startsWith('Date(')) {
                const matches = val.match(/\d+/g);
                if (matches && matches.length >= 3) {
                    const year = matches[0];
                    const month = String(parseInt(matches[1]) + 1).padStart(2, '0');
                    const day = String(matches[2]).padStart(2, '0');
                    return `${day}/${month}/${year}`;
                }
            }
            return val;
        }

        function handleArticleData(json) {
            const container = document.getElementById('article-box');
            try {
                if (!json || !json.table || !json.table.rows) {
                    container.innerHTML = `
                        <div class="empty-state">Không tìm thấy bài viết này!</div>
                        <div style="text-align: center;"><a href="index.html" class="back-btn">&larr; Quay lại Trang Chủ</a></div>
                    `;
                    return;
                }

                const rows = json.table.rows;

                if (articleType === 'baobai') {
                    // Xử lý Báo bài
                    const idx = parseInt(rowIndex);
                    if (isNaN(idx) || idx < 0 || idx >= rows.length || !rows[idx].c) {
                        container.innerHTML = `
                            <div class="empty-state">Không tìm thấy bài viết này!</div>
                            <div style="text-align: center;"><a href="index.html" class="back-btn">&larr; Quay lại Trang Chủ</a></div>
                        `;
                        return;
                    }

                    const r = rows[idx].c;
                    const ngayThang = parseCellValue(r[0]);
                    const monHoc = parseCellValue(r[1]);
                    const noiDung = parseCellValue(r[2]);

                    container.innerHTML = `
                        <a href="index.html" style="text-decoration: none; color: var(--primary-color); font-weight: bold; font-size: 14px;">&larr; Quay lại Trang Chủ</a>
                        <h2 class="article-title" style="margin-top: 15px;">[BÁO BÀI] Môn ${monHoc || 'Học tập'}</h2>
                        <div class="article-meta">🕒 Ngày dặn / Hạn nộp: <b>${ngayThang || 'Chưa cập nhật'}</b></div>
                        <div class="article-body">${noiDung}</div>
                    `;
                } else {
                    // Xử lý Tin tức thông thường
                    let found = false;
                    for (let i = 0; i < rows.length; i++) {
                        const row = rows[i].c;
                        if (!row) continue;

                        const id = row[0] ? (row[0].v !== null ? String(row[0].v) : String(i + 1)) : String(i + 1);
                        if (id === articleId) {
                            found = true;
                            const ngay = parseCellValue(row[1]);
                            const tacGia = row[2] && row[2].v ? String(row[2].v).trim() : 'Ban Truyền thông 12A7';
                            const tieude = row[3] && row[3].v ? String(row[3].v).trim() : '';
                            const noiDung = row[5] && row[5].v ? String(row[5].v).trim() : (row[4] && row[4].v ? String(row[4].v).trim() : '');

                            container.innerHTML = `
                                <a href="index.html" style="text-decoration: none; color: var(--primary-color); font-weight: bold; font-size: 14px;">&larr; Quay lại Trang Chủ</a>
                                <h2 class="article-title" style="margin-top: 15px;">${tieude}</h2>
                                <div class="article-meta">🕒 Ngày đăng: <b>${ngay || 'Chưa cập nhật'}</b> | ✍️ Đăng bởi: <b>${tacGia}</b></div>
                                <div class="article-body">${noiDung}</div>
                            `;
                            break;
                        }
                    }

                    if (!found) {
                        container.innerHTML = `
                            <div class="empty-state">Không tìm thấy bài viết này!</div>
                            <div style="text-align: center;"><a href="index.html" class="back-btn">&larr; Quay lại Trang Chủ</a></div>
                        `;
                    }
                }
            } catch (err) {
                console.error("Lỗi bài viết:", err);
                container.innerHTML = `
                    <div class="empty-state">Không tìm thấy bài viết này!</div>
                    <div style="text-align: center;"><a href="index.html" class="back-btn">&larr; Quay lại Trang Chủ</a></div>
                `;
            }
        }

        window.onload = function() {
            const script = document.createElement('script');
            if (articleType === 'baobai') {
                if (rowIndex === null) {
                    document.getElementById('article-box').innerHTML = `
                        <div class="empty-state">Không tìm thấy bài viết này!</div>
                        <div style="text-align: center;"><a href="index.html" class="back-btn">&larr; Quay lại Trang Chủ</a></div>
                    `;
                    return;
                }
                script.src = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?gid=${GID_BAO_BAI}&tqx=responseHandler:handleArticleData`;
            } else {
                if (!articleId) {
                    document.getElementById('article-box').innerHTML = `
                        <div class="empty-state">Không tìm thấy bài viết này!</div>
                        <div style="text-align: center;"><a href="index.html" class="back-btn">&larr; Quay lại Trang Chủ</a></div>
                    `;
                    return;
                }
                script.src = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=responseHandler:handleArticleData`;
            }
            document.body.appendChild(script);
        };
    </script>
</body>
</html>
