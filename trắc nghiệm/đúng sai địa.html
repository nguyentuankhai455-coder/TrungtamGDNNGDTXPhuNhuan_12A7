<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ôn Tập Kiểm Tra 15' - Phần II</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between items-center m-0 p-0">

    <!-- Mobile Frame Wrapper -->
    <div class="w-full max-w-md min-h-screen bg-white shadow-xl flex flex-col justify-between relative">

        <!-- Header & Progress Bar -->
        <header class="bg-white border-b border-slate-100 sticky top-0 z-10 px-4 py-3">
            <div class="flex items-center justify-between mb-2">
                <h1 class="font-bold text-sm text-slate-700 truncate pr-2">Ôn Tập - Phần II (Đúng/Sai)</h1>
                <span id="progress-text" class="text-xs font-semibold text-slate-500 whitespace-nowrap">Câu 1 / 4</span>
            </div>
            <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-blue-600 h-full w-0 transition-all duration-300"></div>
            </div>
        </header>

        <!-- Main Quiz Container -->
        <main class="w-full p-4 flex-1 flex flex-col justify-center">
            <div id="quiz-container" class="bg-white rounded-2xl p-2">
                <div id="question-area"></div>
                <div id="error-msg" class="text-center font-medium text-sm mt-3 h-6 transition-all"></div>
            </div>
        </main>

        <!-- Footer / Reset Button -->
        <footer class="w-full p-4 text-center border-t border-slate-100 bg-white">
            <button onclick="resetQuiz()" class="text-xs font-medium text-slate-400 hover:text-slate-600 underline">Quay lại (Reset tất cả)</button>
        </footer>

    </div>

    <script>
        const rawQuizData = [
            {
                id: 1,
                question: "Câu 1: Cho thông tin sau:\nTừ tháng 11 đến tháng 4 năm sau, miền Bắc nước ta chịu tác động của gió mùa Đông Bắc. Nửa đầu mùa đông, miền Bắc có thời tiết lạnh khô, nửa sau mùa đông có thời tiết lạnh ẩm, có mưa phùn ở vùng ven biển và các đồng bằng ở Bắc Bộ và Bắc Trung Bộ. Từ 16 độ B trở vào Nam, khối khí lạnh đã bị suy yếu nên Tín phong bán cầu Bắc chiếm ưu thế.",
                options: [
                    { text: "a) Nửa đầu mùa đông, miền Bắc có thời tiết lạnh ẩm.", isCorrect: false },
                    { text: "b) Gió mùa Đông Bắc tác động yếu đến Bắc Trung Bộ do ảnh hưởng của dãy Bạch Mã.", isCorrect: false },
                    { text: "c) Gió mùa Đông Bắc là nguyên nhân chính tạo nên mùa khô ở Nam Bộ.", isCorrect: false },
                    { text: "d) Gió mùa Đông Bắc di chuyển quãng đường dài trên lục địa, gây nên thời tiết lạnh khô vào đầu mùa Đông ở miền Bắc.", isCorrect: true }
                ]
            },
            {
                id: 2,
                question: "Câu 2: Cho thông tin sau:\nNước ta quanh năm nhận được một lượng ẩm rất lớn. Độ ẩm tương đối thường dao động từ 80 - 100%, chỉ có một số địa phương mới có độ ẩm kém hơn, nhưng chỉ giới hạn trong vòng một vài tháng trừ vùng khô hạn ở Khánh Hòa, Lâm Đồng. Biểu hiện rõ rệt nhất của việc nước ta giàu ẩm là lượng mưa hàng năm.",
                options: [
                    { text: "a) Lượng mưa trung bình năm trên toàn bộ lãnh thổ nước ta đạt 3 500 - 4 000 mm.", isCorrect: false },
                    { text: "b) Ở những vùng núi cao và sườn núi đón gió thường có lượng mưa nhỏ.", isCorrect: false },
                    { text: "c) Nước ta có nguồn ẩm dồi dào do thiên nhiên chịu ảnh hưởng sâu sắc của biển.", isCorrect: true },
                    { text: "d) Do có lượng mưa và độ ẩm lớn nên hệ sinh thái rừng thường xanh chiếm ưu thế.", isCorrect: true }
                ]
            },
            {
                id: 3,
                question: "Câu 3: Cho thông tin sau:\nHai đường chí tuyến bắc và nam đã phân chia khí hậu thế giới ra làm hai khu vực cơ bản. Khu vực giữa hai đường chí tuyến gọi là nội chí tuyến, bao gồm khí hậu á chí tuyến, khí hậu á xích đạo và khí hậu xích đạo, với nền nhiệt độ cao.",
                options: [
                    { text: "a) Tọa độ địa lí qui định vị trí nước ta nằm trong vùng nội chí tuyến bán cầu Bắc.", isCorrect: true },
                    { text: "b) Khí hậu nước ta mang tính chất nhiệt đới với nền nhiệt trung bình năm cao trên 20°C.", isCorrect: true },
                    { text: "c) Tất cả các địa điểm trên lãnh thổ nước ta đều có hai lần Mặt trời lên thiên đỉnh cùng nhau.", isCorrect: false },
                    { text: "d) Sinh vật nhiệt đới chiếm ưu thế ở nước ta chủ yếu do tính chất nhiệt đới của khí hậu.", isCorrect: true }
                ]
            },
            {
                id: 4,
                question: "Câu 4: Cho thông tin sau:\nQuanh năm gió Tín phong thổi trên lãnh thổ nước ta và biển Đông, nhưng tùy mùa mà tính chất của nó có thay đổi. Gió Tín phong có dạng độc lập nhất vào mùa xuân, khi hai luồng gió mùa đều yếu.",
                options: [
                    { text: "a) Gió Tín phong bán cầu Bắc hoạt động quanh năm trên lãnh thổ nước ta.", isCorrect: true },
                    { text: "b) Do tác động của Tín phong bán cầu Bắc, vào mùa đông ở miền Bắc thường xuất hiện những ngày nắng ấm xen kẽ những ngày thời tiết âm u.", isCorrect: true },
                    { text: "c) Tín phong bán cầu Bắc là nguyên nhân chủ yếu gây ra mùa khô cho khu vực cao nguyên phía tây Nam Trung Bộ và Nam Bộ.", isCorrect: true },
                    { text: "d) Gió Tín phong kết hợp với hoạt động của dải hội tụ gây nên sự phân hóa mưa - khô ở hai sườn dãy Trường Sơn của nước ta.", isCorrect: false }
                ]
            }
        ];

        let quizData = rawQuizData.map(q => ({
            ...q,
            attempts: 0,
            correctCount: 0, // Đếm số ý đúng đã chọn trong câu này
            answered: {}
        }));

        let currentQuestionIndex = 0;
        let totalScore = 0;

        function renderQuiz() {
            const container = document.getElementById('question-area');
            const progressText = document.getElementById('progress-text');
            const progressBar = document.getElementById('progress-bar');
            const errorMsg = document.getElementById('error-msg');
            
            errorMsg.innerText = "";
            errorMsg.className = "text-center font-medium text-sm mt-3 h-6 transition-all";

            if (currentQuestionIndex >= quizData.length) {
                renderResult();
                return;
            }

            progressText.innerText = `Câu ${currentQuestionIndex + 1} / ${quizData.length}`;
            progressBar.style.width = `${((currentQuestionIndex) / quizData.length) * 100}%`;

            const q = quizData[currentQuestionIndex];

            let html = `
                <h2 class="font-semibold text-slate-800 text-xs sm:text-sm mb-3 leading-relaxed whitespace-pre-line">${q.question}</h2>
                <div class="space-y-2 mb-4 max-h-[50vh] overflow-y-auto pr-1">
            `;

            q.options.forEach((opt, idx) => {
                let statusIcon = "";
                let btnClass = "w-full text-left p-3 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 text-xs sm:text-sm font-medium transition flex items-center justify-between";

                if (q.answered[idx] !== undefined) {
                    if (q.answered[idx] === true) {
                        statusIcon = '<span class="text-green-600 font-bold text-base ml-2">✓ Đúng</span>';
                        btnClass += " bg-green-50 border-green-300 text-green-800";
                    } else {
                        statusIcon = '<span class="text-red-600 font-bold text-base ml-2">✕ Sai</span>';
                        btnClass += " bg-red-50 border-red-300 text-red-800";
                    }
                }

                html += `
                    <button onclick="handleOptionClick(${idx})" class="${btnClass}">
                        <span class="flex-1">${opt.text}</span>
                        ${statusIcon}
                    </button>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        function handleOptionClick(optIdx) {
            const q = quizData[currentQuestionIndex];
            const opt = q.options[optIdx];
            const errorMsg = document.getElementById('error-msg');

            if (q.answered[optIdx] !== undefined) return; // Đã bấm rồi thì thôi

            if (opt.isCorrect) {
                q.answered[optIdx] = true;
                q.correctCount++;
                errorMsg.innerText = "";

                // Kiểm tra xem đã tìm đủ tất cả các ý đúng của câu này chưa
                let totalCorrectInQuestion = q.options.filter(o => o.isCorrect).length;
                
                if (q.correctCount === totalCorrectInQuestion) {
                    // Cộng điểm theo thang điểm dựa trên tổng số ý đúng của câu (ở đây 4 câu Phần II mỗi câu có các mức điểm quy đổi)
                    // Hoặc tính điểm quy đổi dựa trên số ý đúng tìm được:
                    // 1 câu đúng 1 ý: 0.1, đúng 2 ý: 0.25, đúng 3 ý: 0.5, đúng hết: 1.0
                    let questionScore = 0;
                    if (q.correctCount === 1) questionScore = 0.1;
                    else if (q.correctCount === 2) questionScore = 0.25;
                    else if (q.correctCount === 3) questionScore = 0.5;
                    else if (q.correctCount >= 4) questionScore = 1.0;

                    totalScore += questionScore;

                    setTimeout(() => {
                        currentQuestionIndex++;
                        renderQuiz();
                    }, 400);
                } else {
                    renderQuiz();
                }
            } else {
                q.answered[optIdx] = false;
                q.attempts++;
                
                errorMsg.innerText = "VUI LÒNG THỬ LẠI";
                
                if (q.attempts === 1) {
                    errorMsg.className = "text-center font-medium text-sm mt-3 h-6 transition-all text-red-500";
                } else if (q.attempts === 2) {
                    errorMsg.className = "text-center font-semibold text-sm mt-3 h-6 transition-all text-red-600";
                } else {
                    errorMsg.className = "text-center font-bold text-sm mt-3 h-6 transition-all text-rose-800";
                }

                renderQuiz();
            }
        }

        function renderResult() {
            document.getElementById('progress-text').innerText = "Hoàn thành";
            document.getElementById('progress-bar').style.width = "100%";

            const container = document.getElementById('question-area');
            document.getElementById('error-msg').innerText = "";

            // Làm tròn điểm gọn gàng (ví dụ lấy tối đa 2 chữ số thập phân nếu có lẻ)
            let finalScoreFormatted = Math.round(totalScore * 100) / 100;

            container.innerHTML = `
                <div class="text-center py-6">
                    <div class="inline-flex items-center justify-center w-16 h-16 bg-green-100 text-green-600 rounded-full mb-4 text-2xl font-bold">✓</div>
                    <h2 class="text-lg font-bold text-slate-800 mb-2">Hoàn thành bài ôn tập Phần II!</h2>
                    <p class="text-base sm:text-lg font-bold text-green-600 mb-6 px-2">CHÚC MỪNG BẠN ĐÃ ĐƯỢC ${finalScoreFormatted} ĐIỂM</p>
                    <button onclick="resetQuiz()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow transition text-sm">Làm lại từ đầu</button>
                </div>
            `;
        }

        function resetQuiz() {
            currentQuestionIndex = 0;
            totalScore = 0;
            quizData = rawQuizData.map(q => ({
                ...q,
                attempts: 0,
                correctCount: 0,
                answered: {}
            }));
            renderQuiz();
        }

        renderQuiz();
    </script>
</body>
</html>
