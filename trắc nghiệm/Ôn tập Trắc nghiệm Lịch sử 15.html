            { id: 29, question: "Liên hợp quốc xem việc bảo đảm quyền con người và thúc đẩy sự phát triển là", options: [{ text: "Những yếu tố có mối liên hệ chặt chẽ với hòa bình, an ninh thế giới.", isCorrect: true }, { text: "Công cụ chủ yếu để can thiệp vào công việc nội bộ của cường quốc.", isCorrect: false }, { text: "Những vấn đề độc lập, không liên quan đến vấn đề an ninh toàn cầu.", isCorrect: false }, { text: "Trách nhiệm riêng của từng quốc gia, dân tộc với tổ chức chính phủ.", isCorrect: false }] },
            { id: 30, question: "Năm 2015, Liên hợp quốc thông qua Chương trình nghị sự 2030 vì sự phát triển bền vững nhằm thực hiện mục tiêu nào sau đây?", options: [{ text: "Duy trì nguyên trạng trật tự lưỡng cực.", isCorrect: false }, { text: "Thúc đẩy việc chế tạo vũ khí nguyên tử.", isCorrect: false }, { text: "Hạn chế sự hợp tác kinh tế của các nước.", isCorrect: false }, { text: "Hành động ứng phó với biến đổi khí hậu.", isCorrect: true }] },
            { id: 31, question: "Sự gia tăng số lượng thành viên từ 51 nước (1945) lên 193 nước hiện nay minh chứng rõ nét nhất cho vai trò nào của Liên hợp quốc?", options: [{ text: "Giải quyết triệt để vấn đề đói nghèo ở châu Phi.", isCorrect: false }, { text: "Mở rộng ranh giới lãnh thổ toàn cầu.", isCorrect: false }, { text: "Thúc đẩy quá trình giành độc lập dân tộc của các nước thuộc địa và phụ thuộc.", isCorrect: true }, { text: "Chấm dứt hoàn toàn vũ khí hạt nhân.", isCorrect: false }] },
            { id: 32, question: "Một trong những nguyên tắc hoạt động của Liên hợp quốc được quy định trong Hiến chương Liên hợp quốc (năm 1945) là", options: [{ text: "tôn trọng quyết định của 5 nước Uỷ viên thường trực.", isCorrect: false }, { text: "tôn trọng các nghĩa vụ và luật pháp quốc tế.", isCorrect: true }, { text: "tôn trọng độc lập của 50 nước sáng lập Liên hợp quốc.", isCorrect: false }, { text: "không đưa quân đội Liên hợp quốc vào các khu vực.", isCorrect: false }] },
            { id: 33, question: "Mối quan hệ giữa các thành viên của Liên hợp quốc dựa trên nền tảng nào sau đây?", options: [{ text: "Bình đẳng chủ quyền, tôn trọng toàn vẹn lãnh thổ và độc lập chính trị các nước.", isCorrect: true }, { text: "Chỉ coi trọng lợi ích quốc gia và quyền lợi dân tộc trong quan hệ quốc tế.", isCorrect: false }, { text: "Không can thiệp vào cuộc xung đột trên thế giới, đặc biệt ở Trung Đông.", isCorrect: false }, { text: "Chung sống hòa bình và đảm bảo sự nhất trí của các quốc gia tư bản chủ nghĩa.", isCorrect: false }] },
            { id: 34, question: "Bản Hiến chương được đánh giá là văn kiện quan trọng hàng đầu của tổ chức Liên hợp quốc vì lí do nào sau đây?", options: [{ text: "Là cơ sở pháp lí để các nước tham gia Liên hợp quốc.", isCorrect: false }, { text: "Nêu rõ các mục đích hoạt động của Liên hợp quốc.", isCorrect: false }, { text: "Đề ra các nguyên tắc hoạt động của Liên hợp quốc.", isCorrect: true }, { text: "Quy định các tổ chức, cơ chế hoạt động của Liên hợp quốc.", isCorrect: false }] },
            { id: 35, question: "Liên hợp quốc có hoạt động nào sau đây để bảo đảm quyền con người?", options: [{ text: "Can thiệp trực tiếp vào các nước để thi hành triệt để quyền con người.", isCorrect: false }, { text: "Xây dựng và kí kết các văn bản, điều ước quốc tế về quyền con người.", isCorrect: true }, { text: "Thành lập khối phòng thủ chung dựa trên cơ sở nguyên tắc đồng thuận.", isCorrect: false }, { text: "Xây dựng thể chế chính trị thống nhất cho các nước mới nổi ở châu Á.", isCorrect: false }] },
            { id: 36, question: "Nhằm duy trì hoà bình và an ninh thế giới sau chiến tranh, Hội nghị I-an-ta (2-1945) có quyết định quan trọng nào sau đây?", options: [{ text: "Thành lập Ban Thư kí Liên hợp quốc.", isCorrect: false }, { text: "Thành lập tổ chức Hội Quốc liên.", isCorrect: false }, { text: "Duy trì và mở rộng Hội Quốc liên.", isCorrect: false }, { text: "Thành lập tổ chức Liên hợp quốc.", isCorrect: true }] },
            { id: 37, question: "Nội dung nào sau đây đã khiến ý tưởng thành lập Liên hợp quốc ngày càng trở nên cấp thiết trong giai đoạn cuối của Chiến tranh thế giới thứ hai?", options: [{ text: "Nhu cầu hợp tác để ngăn chặn sự phát triển của các nước chủ nghĩa xã hội.", isCorrect: false }, { text: "Sự xuất hiện của hàng loạt quốc gia độc lập ở châu Á, châu Phi, Mĩ Latinh.", isCorrect: false }, { text: "Mong muốn của các nước lớn về việc phân chia lại thị trường và thuộc địa.", isCorrect: false }, { text: "Hậu quả nghiêm trọng của chiến tranh và khát vọng hòa bình của nhân loại.", isCorrect: true }] },
            { id: 38, question: "Nội dung nào sau đây phản ánh đúng vai trò của Liên hợp quốc trong việc thúc đẩy sự phát triển kinh tế, tài chính, thương mại quốc tế và nâng cao đời sống người dân?", options: [{ text: "Ngăn chặn thành công tình trạng xung đột lợi ích giữa các quốc gia.", isCorrect: false }, { text: "Góp phần thúc đẩy cuộc đấu tranh giành độc lập dân tộc trên thế giới.", isCorrect: false }, { text: "Thực thi quyền con người, xây dựng một thế giới không có cạnh tranh.", isCorrect: false }, { text: "Tạo môi trường kinh tế bình đẳng, hỗ trợ các nền kinh tế kém phát triển.", isCorrect: true }] },
            { id: 39, question: "Để duy trì nền hoà bình và an ninh trên thế giới, Liên hợp quốc đã có nỗ lực và hành động nào sau đây trong suốt quá trình hoạt động?", options: [{ text: "Hỗ trợ các nước Đông Nam Á đạt được sự đồng đều về kinh tế.", isCorrect: false }, { text: "Xây dựng hệ thống các công ước quốc tế về giải trừ quân bị.", isCorrect: true }, { text: "Thúc đẩy thành lập các tổ chức liên kết khu vực trên thế giới.", isCorrect: false }, { text: "Buộc Mĩ và Liên Xô phải tuyên bố chấm dứt Chiến tranh lạnh.", isCorrect: false }] },
            { id: 40, question: "Xây dựng và soạn thảo được một hệ thống các công ước quốc tế về giải trừ quân bị chống chạy đua vũ trang là hoạt động thể hiện vai trò nào của Liên hợp quốc?", options: [{ text: "Duy trì hòa bình và an ninh quốc tế.", isCorrect: true }, { text: "Hạn chế vai trò của các tổ chức quốc tế.", isCorrect: false }, { text: "Ngăn chặn sự cạnh tranh kinh tế của các nước.", isCorrect: false }, { text: "Thúc đẩy phát triển kinh tế, tài chính các nước.", isCorrect: false }] },
            { id: 41, question: "Quan hệ Mỹ – Liên Xô trong và sau Chiến tranh thế giới thứ hai đã chuyển biến từ", options: [{ text: "đồng minh sang đối đầu.", isCorrect: true }, { text: "đối đầu sang thoả hiệp.", isCorrect: false }, { text: "đối đầu sang đối thoại.", isCorrect: false }, { text: "đồng minh sang đối tác.", isCorrect: false }] },
            { id: 42, question: "Cuộc chiến tranh nào sau đây đã trở thành cuộc chiến tranh cục bộ lớn nhất phản ánh mâu thuẫn giữa hai cực, hai phe – tư bản chủ nghĩa và xã hội chủ nghĩa?", options: [{ text: "Cuộc chiến tranh trên bán đảo Triều Tiên (1950 – 1953).", isCorrect: false }, { text: "Nội chiến Quốc – Cộng ở Trung Quốc (1946 – 1949).", isCorrect: false }, { text: "Chiến tranh của Pháp ở Đông Dương (1945 – 1954).", isCorrect: false }, { text: "Cuộc chiến tranh của Mỹ ở Việt Nam (1954 – 1975).", isCorrect: true }] },
            { id: 43, question: "Nội dung nào sau đây là một trong những quyết định của Hội nghị I-an-ta (2-1945)?", options: [{ text: "Tiêu diệt tận gốc chủ nghĩa phát xít Đức và chủ nghĩa quân phiệt Nhật Bản.", isCorrect: true }, { text: "Xây dựng một trật tự thế giới mới nhằm giải quyết dứt điểm các vấn đề hậu chiến tranh.", isCorrect: false }, { text: "Thoả thuận việc phân chia phạm vi ảnh hưởng của Mỹ và Liên Xô ở châu Phi.", isCorrect: false }, { text: "Đồng ý thành lập tổ chức Hội Quốc liên để duy trì hoà bình và an ninh thế giới.", isCorrect: false }] },
            { id: 44, question: "Gần đây, UNICEF và các tổ chức của Liên hợp quốc nỗ lực cung cấp vắc-xin miễn phí cho trẻ em vùng sâu vùng xa trên thế giới. Đây là biểu hiện cho mục tiêu nào của Hiến chương?", options: [{ text: "Duy trì quyền phủ quyết của các cường quốc.", isCorrect: false }, { text: "Giải quyết các vấn đề nhân đạo và đảm bảo quyền con người.", isCorrect: true }, { text: "Ngăn chặn chạy đua vũ trang.", isCorrect: false }, { text: "Phân định lại biên giới các quốc gia.", isCorrect: false }] }
        ];

        let currentIndex = 0;
        let score = 0;
        let userAttempts = {};
        let questionStatus = {};
        let activeQuestions = [];

        function initApp() {
            currentIndex = 0;
            score = 0;
            userAttempts = {};
            questionStatus = {};
            activeQuestions = JSON.parse(JSON.stringify(rawQuestions));
            activeQuestions.forEach((q, idx) => {
                userAttempts[idx] = 0;
                questionStatus[idx] = null;
                shuffleArray(q.options);
            });
            renderQuiz();
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            const progressText = document.getElementById('progress-text');
            const progressBar = document.getElementById('progress-bar');
            const scoreDisplay = document.getElementById('score-display');

            scoreDisplay.innerText = `Điểm (Lần 1): ${score}`;
            const total = activeQuestions.length;

            if (currentIndex >= total) {
                renderResultScreen();
                return;
            }

            progressText.innerText = `Câu ${currentIndex + 1} / ${total}`;
            progressBar.style.width = `${((currentIndex + 1) / total) * 100}%`;

            const q = activeQuestions[currentIndex];
            let html = `
                <div class="space-y-3 flex-1 flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between mb-1.5">
                            <span class="text-[11px] font-bold px-2.5 py-0.5 bg-red-50 text-red-700 rounded-full uppercase">Câu hỏi ${currentIndex + 1}</span>
                        </div>
                        <h2 class="text-sm sm:text-base font-semibold text-slate-800 leading-snug mb-3">${q.question}</h2>
                        <div class="space-y-2 mt-2" id="options-list">
            `;

            q.options.forEach((opt, oIdx) => {
                html += `
                    <button onclick="handleSelect(${oIdx})" class="w-full text-left p-3 rounded-xl border border-slate-200 bg-white hover:bg-red-50/70 hover:border-red-300 text-xs sm:text-sm font-medium text-slate-700 transition-all flex items-center shadow-xs active:scale-[0.99]">
                        <span class="w-6 h-6 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center text-xs font-bold mr-3 flex-shrink-0">${String.fromCharCode(65 + oIdx)}</span>
                        <span class="flex-1">${opt.text}</span>
                    </button>
                `;
            });

            html += `
                        </div>
                    </div>
                    <div class="pt-3 border-t border-slate-100 flex justify-between items-center text-[11px] text-slate-500 mt-2">
                        <span>Số lần thử câu này: <strong id="attempt-counter" class="text-red-600">${userAttempts[currentIndex]}</strong></span>
                        <span class="italic text-rose-500 font-medium">Đúng mới được qua câu!</span>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        function handleSelect(optionIndex) {
            const q = activeQuestions[currentIndex];
            const selectedOpt = q.options[optionIndex];
            
            userAttempts[currentIndex]++;
            const attempts = userAttempts[currentIndex];
            document.getElementById('attempt-counter').innerText = attempts;

            if (selectedOpt.isCorrect) {
                if (attempts === 1) {
                    score += 1;
                    questionStatus[currentIndex] = 'green';
                } else {
                    questionStatus[currentIndex] = 'yellow';
                }

                showToast("Chính xác! Đang chuyển câu...", "success");
                setTimeout(() => {
                    hideToast();
                    currentIndex++;
                    renderQuiz();
                }, 700);

            } else {
                if (attempts === 1) questionStatus[currentIndex] = 'red1';
                else if (attempts === 2) questionStatus[currentIndex] = 'red2';
                else questionStatus[currentIndex] = 'red3';

                const optList = document.getElementById('options-list');
                optList.classList.add('animate-shake');
                setTimeout(() => optList.classList.remove('animate-shake'), 400);

                showToast("VUI LÒNG THỬ LẠI", "error");
            }
        }

        function showToast(message, type) {
            const container = document.getElementById('toast-container');
            const msgBox = document.getElementById('toast-message');
            container.classList.remove('hidden');
            msgBox.innerText = message;

            if (type === 'success') {
                msgBox.className = "p-2.5 rounded-xl text-xs sm:text-sm font-semibold text-center bg-emerald-100 text-emerald-800 border border-emerald-200 shadow-sm";
            } else {
                msgBox.className = "p-2.5 rounded-xl text-xs sm:text-sm font-semibold text-center bg-rose-100 text-rose-800 border border-rose-200 shadow-sm";
            }
        }

        function hideToast() {
            document.getElementById('toast-container').classList.add('hidden');
        }

        function renderResultScreen() {
            const container = document.getElementById('quiz-container');
            document.getElementById('progress-text').innerText = "Hoàn thành";
            document.getElementById('progress-bar').style.width = "100%";

            let matrixHtml = '<div class="grid grid-cols-6 gap-1.5 my-3">';
            activeQuestions.forEach((_, idx) => {
                let colorClass = 'bg-slate-200 text-slate-600';
                const status = questionStatus[idx];
                
                if (status === 'green') colorClass = 'bg-emerald-500 text-white font-bold';
                else if (status === 'yellow') colorClass = 'bg-amber-400 text-white font-bold';
                else if (status === 'red1') colorClass = 'bg-rose-400 text-white font-bold';
                else if (status === 'red2') colorClass = 'bg-rose-600 text-white font-bold';
                else if (status === 'red3') colorClass = 'bg-rose-950 text-white font-bold';

                matrixHtml += `<div class="${colorClass} rounded-lg py-1.5 text-center text-xs flex items-center justify-center shadow-xs">C${idx+1}</div>`;
            });
            matrixHtml += '</div>';

            container.innerHTML = `
                <div class="flex flex-col items-center justify-center text-center py-4 space-y-3">
                    <div class="w-14 h-14 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center text-2xl font-bold shadow-inner">
                        🏆
                    </div>
                    <div>
                        <h2 class="text-base sm:text-lg font-bold text-slate-800 uppercase">CHÚC MỪNG BẠN ĐÃ ĐƯỢC ${score} ĐIỂM</h2>
                        <p class="text-[11px] text-slate-500 mt-0.5">Tổng số điểm đạt được khi người chơi nhấp đúng câu trả lời đúng lần đầu (Màu xanh lá).</p>
                    </div>

                    <div class="w-full text-left bg-slate-50 p-3 rounded-2xl border border-slate-200">
                        <p class="text-[11px] font-bold text-slate-700 mb-1">Bảng thống kê trạng thái các câu:</p>
                        ${matrixHtml}
                        <div class="grid grid-cols-2 gap-1 text-[10px] text-slate-600 mt-2">
                            <span class="flex items-center"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block mr-1.5"></span> Xanh lá (Đúng lần 1)</span>
                            <span class="flex items-center"><span class="w-2.5 h-2.5 rounded-full bg-amber-400 inline-block mr-1.5"></span> Vàng (Đúng lần 2+)</span>
                            <span class="flex items-center"><span class="w-2.5 h-2.5 rounded-full bg-rose-400 inline-block mr-1.5"></span> Đỏ (Sai lần 1)</span>
                            <span class="flex items-center"><span class="w-2.5 h-2.5 rounded-full bg-rose-600 inline-block mr-1.5"></span> Đỏ đậm (Sai lần 2)</span>
                            <span class="flex items-center col-span-2 justify-center"><span class="w-2.5 h-2.5 rounded-full bg-rose-950 inline-block mr-1.5"></span> Đỏ đen (Sai từ lần 3+)</span>
                        </div>
                    </div>

                    <button onclick="initApp()" class="w-full py-3 bg-red-600 hover:bg-red-700 text-white font-bold rounded-xl shadow-md transition-all text-xs sm:text-sm mt-2 flex items-center justify-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        Quay lại để Reset lại tất cả
                    </button>
                </div>
            `;
        }

        window.onload = initApp;
    </script>
</body>
</html>
